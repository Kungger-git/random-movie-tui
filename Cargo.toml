[package]
name = "random-movie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI that picks random movies and shows their posters"
license = "MIT"
repository = "https://github.com/Kungger-git/random-movie-tui"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
fastrand = "2"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
open = "5"
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", features = ["json", "gzip", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "signal"] }
toml = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
